[project]
name = "intake-synth"
version = "0.3.0"
description = "Synthetic clinical lab-request generator and evaluation harness for clinical-intake-verifier"
authors = [{ name = "Nicolás Barceló" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "pillow>=13",
    "numpy>=2.0",
    "faker>=30.0",
    "typer>=0.12",
    "jsonschema>=4.23",
]

[project.scripts]
intake-synth = "intake_synth.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
