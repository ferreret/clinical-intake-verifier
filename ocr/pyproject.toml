[project]
name = "intake-ocr"
version = "0.1.0"
description = "OCR engines with positions for the text pipeline of clinical-intake-verifier"
authors = [{ name = "Nicolás Barceló" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdfium2>=4.30",
    "pillow>=13",
    "numpy>=2.0",
    "typer>=0.12",
    "jsonschema>=4.23",
    "opencv-python-headless>=4.10",
    "rapidocr==3.9.2",
    "onnxruntime>=1.20",
]

[project.scripts]
intake-ocr = "intake_ocr.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
